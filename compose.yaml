services:
  web:
    build: .
    env_file: .env
    command:
    - sh
    - -c
    - |
        python manage.py migrate --noinput &&
        python manage.py bootstrap_admin &&
        python manage.py collectstatic --noinput &&
        exec gunicorn fedi_anime_awards.wsgi:application \
        --bind 0.0.0.0:8000 \
        --workers 1

    volumes:
      - sqlite_data:/data
      - static_files:/app/staticfiles
      - media_data:/app/media
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()" ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  worker:
    build: .
    env_file: .env
    command: ["python", "manage.py", "db_worker"]
    volumes:
      - sqlite_data:/data
      - media_data:/app/media
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_files:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
      - media_data:/media:ro
    restart: unless-stopped
    depends_on:
      - web

volumes:
  sqlite_data:
  static_files:
  media_data:
  caddy_data:
  caddy_config:
